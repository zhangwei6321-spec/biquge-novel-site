name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://biquge-novel-site.onrender.com/api/sources" || true
